name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Env and Secret Files
        run: |
          # 1. Tạo thư mục secrets
          mkdir -p secrets
          
          cat << 'EOF' > secrets/firebase-service-account.json
          ${{ secrets.FIREBASE_JSON }}
          EOF
          
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF
          
          echo "CLOUDFLARE_TOKEN=${{ secrets.CLOUDFLARE_TOKEN }}" >> .env

      - name: Build and Deploy with Docker Compose
        run: |
          docker compose down
          docker compose up -d --build
          docker image prune -f