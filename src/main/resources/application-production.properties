app.verification.require-protected-storage=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# CORS chỉ cho các origin frontend đã khai báo trong môi trường triển khai.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Chỉ nhận IP từ hop cloudflared/proxy đã được khai báo chính xác. Mặc định không tin proxy nào.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=CF-Connecting-IP
server.tomcat.remoteip.internal-proxies=${APP_TRUSTED_EDGE_PROXIES:(?!)}
