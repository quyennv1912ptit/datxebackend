spring.config.import=optional:file:./.env[.properties]

spring.application.name=datxebackend
server.port=8080

firebase.credentials-location=${FIREBASE_CREDENTIALS_LOCATION:file:./secrets/firebase-service-account.json}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.data.redis.url=${REDIS_URL}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

mapbox.token=${MAPBOX_TOKEN}
cloudinary.url=${CLOUDINARY_URL}

app.driver.required-document-types=${DRIVER_REQUIRED_DOCUMENT_TYPES:CCCD,DRIVER_LICENSE}
app.driver.license-document-type=${DRIVER_LICENSE_DOCUMENT_TYPE:DRIVER_LICENSE}
app.bootstrap.admin.firebase-uid=${BOOTSTRAP_ADMIN_FIREBASE_UID:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:}
app.bootstrap.pricing.enabled=${BOOTSTRAP_PRICING_ENABLED:false}
app.bootstrap.pricing.car.base-fare=${BOOTSTRAP_PRICING_CAR_BASE_FARE:}
app.bootstrap.pricing.car.per-km=${BOOTSTRAP_PRICING_CAR_PER_KM:}
app.bootstrap.pricing.car.min-fare=${BOOTSTRAP_PRICING_CAR_MIN_FARE:}
app.bootstrap.pricing.motorcycle.base-fare=${BOOTSTRAP_PRICING_MOTORCYCLE_BASE_FARE:}
app.bootstrap.pricing.motorcycle.per-km=${BOOTSTRAP_PRICING_MOTORCYCLE_PER_KM:}
app.bootstrap.pricing.motorcycle.min-fare=${BOOTSTRAP_PRICING_MOTORCYCLE_MIN_FARE:}
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:1000}
ride.dispatch.recovery-interval-ms=${RIDE_DISPATCH_RECOVERY_INTERVAL_MS:10000}

places.provider=${PLACES_PROVIDER:auto}
places.goong-api-key=${GOONG_API_KEY:}

# Service area: pickup and dropoff must stay inside this circle when enabled.
app.service-area.enabled=${SERVICE_AREA_ENABLED:true}
app.service-area.center-lat=${SERVICE_AREA_CENTER_LAT:21.0285}
app.service-area.center-lng=${SERVICE_AREA_CENTER_LNG:105.8542}
app.service-area.radius-km=${SERVICE_AREA_RADIUS_KM:50}

# Sequential dispatch: all timings are server-owned.
app.matching.offer-timeout=${MATCHING_OFFER_TTL:27s}
app.matching.search-timeout=${MATCHING_SEARCH_TIMEOUT:90s}
app.matching.search-radii-km=${MATCHING_RADIUS_STEPS:2,3,5}
app.matching.max-candidates-per-round=${MATCHING_TOP_N:5}
app.matching.ranking-mode=${MATCHING_RANKING_MODE:DISTANCE}
app.matching.rescan-delay=${MATCHING_RESCAN_DELAY:3s}
app.matching.driver-alive-ttl=${MATCHING_LOCATION_STALE:30s}
app.matching.max-redispatch=${MATCHING_MAX_REDISPATCH:2}
app.matching.offer-grace=${MATCHING_OFFER_GRACE:1s}
app.matching.client-offer-grace=${MATCHING_CLIENT_OFFER_GRACE:2s}
app.matching.driver-disconnect-timeout=${MATCHING_DRIVER_DISCONNECT_TIMEOUT:60s}
app.matching.candidate-scan-limit=${MATCHING_CANDIDATE_SCAN_LIMIT:500}
app.matching.ignored-threshold=${MATCHING_IGNORED_THRESHOLD:3}
app.matching.ignored-penalty=${MATCHING_IGNORED_PENALTY:20}
app.matching.ignored-window=${MATCHING_IGNORED_WINDOW:30m}
app.notifications.delivery-timeout-ms=${NOTIFICATION_DELIVERY_TIMEOUT_MS:2000}
app.matching.rejected-ttl=${MATCHING_REJECTED_TTL:120s}
app.matching.idempotency-ttl=${RIDE_IDEMPOTENCY_TTL:5m}
